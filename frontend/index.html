<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-title" content="RDP Web Client">
    <meta name="theme-color" content="#0a0a1a">
    <link rel="icon" type="image/x-icon" href="/favicons/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png">
    <link rel="manifest" href="/favicons/site.webmanifest">
    <title>RDP Web Client</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            height: 100dvh;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b0f17;
            color: #fff;
            overflow: hidden;
        }

        /* The page shell follows the OS colour scheme so the area around the
           client matches it; the client itself themes independently. */
        @media (prefers-color-scheme: light) {
            body { background: #eef1f6; color: #101828; }
        }

        /* The client owns the entire viewport. */
        #rdp-container {
            width: 100%;
            height: 100%;
            height: 100dvh;
            min-height: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="rdp-container"></div>

    <script type="module">
        import { RDPClient } from './rdp-client.js';

        // Create the RDP client instance.
        // wsUrl defaults to same-origin /ws/ (nginx proxies to the backend).
        const client = new RDPClient(document.getElementById('rdp-container'), {
            showTopBar: true,
            showBottomBar: true,
            keepConnectionModalOpen: false,
            // Follow the OS theme on load; the toolbar toggle overrides it.
            themeMode: 'auto'
        });

        client.on('connected', (data) => {
            console.log('Connected!', data);
        });

        client.on('disconnected', () => {
            console.log('Disconnected');
        });

        client.on('error', (err) => {
            console.error('Error:', err.message);
        });

        client.on('resize', ({ width, height }) => {
            console.log(`Resolution changed to ${width}x${height}`);
        });

        client.on('mute', ({ muted }) => {
            console.log('Audio mute state changed:', muted);
        });

        // Expose for manual debugging in the browser console.
        window.rdpClient = client;
    </script>
</body>
</html>
